
name: Prisma Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - uses: prisma/cloud-deploy-action@v1
        with:
          build-command: npm run build --if-present
